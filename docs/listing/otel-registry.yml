description:
  A Claude Code plugin and set of Codex skills that scan a repository, detect
  its services, and generate OpenTelemetry SDK bootstrap code for Node.js,
  Python, .NET, Go, Ruby, and Rust, or Java agent configuration. It also
  generates otelcol-contrib Collector configurations and Terraform for
  dashboards, alerts, and SLOs on Grafana, Datadog, New Relic, and Dash0, and
  can start a local grafana/otel-lgtm stack to view the first traces, logs, and
  metrics.
