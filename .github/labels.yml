# Source of truth for repository labels.
# Apply with a label-sync action, or by hand in Settings > Labels.

- name: bug
  color: d73a4a
  description: Something in the plugin itself misbehaves
- name: incorrect-output
  color: b60205
  description: Generated bootstrap, Collector config, or Terraform is wrong
- name: coverage
  color: 0e8a16
  description: Request for a language, framework, or vendor backend
- name: drift
  color: fbca04
  description: A pinned semconv, SDK, agent, or provider version is stale
- name: dependencies
  color: 0366d6
  description: Dependency and version-pin changes
- name: semconv
  color: 5319e7
  description: Semantic-convention correctness
- name: terraform
  color: 623ce4
  description: Backend module generation
- name: collector
  color: 1d76db
  description: OpenTelemetry Collector configuration
- name: hooks
  color: c2e0c6
  description: Guardrails, write-guard, semconv-lint, force sentinel
- name: codex
  color: 4b5563
  description: Codex bridge, skills, and hook adapters
- name: docs
  color: 006b75
  description: Documentation and examples
- name: good first issue
  color: 7057ff
  description: A well-scoped place to start
- name: help wanted
  color: 008672
  description: Maintainer would welcome someone picking this up
- name: needs-triage
  color: ededed
  description: Not yet looked at
- name: needs-repro
  color: fef2c0
  description: Waiting on a reproduction or generated output
- name: roadmap
  color: d4c5f9
  description: Tracked on the public roadmap
