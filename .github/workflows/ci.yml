# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run to catch semconv / SDK / provider drift
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  lint-hooks:
    name: Hook lint tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run write-guard tests
        run: bash tests/hooks/write-guard.test.sh

      - name: Run semconv-lint tests
        run: bash tests/hooks/semconv-lint.test.sh

      - name: Run session-summary tests
        run: bash tests/hooks/session-summary.test.sh

      - name: Run Codex hook-adapter tests
        run: bash tests/hooks/codex-adapters.test.sh

      - name: Run drift-check parser tests (offline)
        run: bash tests/drift-check.test.sh

  validate-codex-bridge:
    name: Validate Codex bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate .codex/hooks.json + adapters
        run: |
          python3 -c "import json; json.load(open('.codex/hooks.json'))"
          test -f hooks/codex/pre-tool-use.py
          test -f hooks/codex/post-tool-use.py
          python3 -m py_compile hooks/codex/_bridge.py hooks/codex/pre-tool-use.py hooks/codex/post-tool-use.py

      - name: Check .agents/skills bridge references resolve
        run: |
          python3 - <<'EOF'
          import glob, os, re, sys
          pat = re.compile(r'`((?:commands|skills|agents)/[A-Za-z0-9/_.-]+|backends\.txt)`')
          missing = set()
          for f in glob.glob('.agents/skills/*/SKILL.md'):
            for ref in pat.findall(open(f).read()):
              if not os.path.exists(ref):
                missing.add(f"{f} -> {ref}")
          if missing:
            print("Broken Codex-bridge references:")
            for x in sorted(missing):
              print(" -", x)
            sys.exit(1)
          print("All Codex-bridge references resolve.")
          EOF

  validate-fixtures:
    name: Validate fixture structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check nodejs-greenfield fixture
        run: |
          test -f fixtures/nodejs-greenfield/package.json
          test -f fixtures/nodejs-greenfield/index.js
          test -f fixtures/nodejs-greenfield/Dockerfile
          # Verify no OTel packages in greenfield fixture
          ! grep -q "@opentelemetry" fixtures/nodejs-greenfield/package.json

      - name: Check python-greenfield fixture
        run: |
          test -f fixtures/python-greenfield/pyproject.toml
          test -f fixtures/python-greenfield/app.py
          test -f fixtures/python-greenfield/Dockerfile
          ! grep -q "opentelemetry" fixtures/python-greenfield/pyproject.toml

      - name: Check nodejs-brownfield fixture has seeded violations
        run: |
          test -f fixtures/nodejs-brownfield/tracing.js
          grep -q "service.name" fixtures/nodejs-brownfield/tracing.js
          grep -q "http.method" fixtures/nodejs-brownfield/tracing.js
          grep -q "orderId" fixtures/nodejs-brownfield/tracing.js

  validate-plugin-manifest:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON (plugin + marketplace)
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Check plugin structure (auto-discovery conventions)
        run: |
          python3 - <<'EOF'
          import json, os, sys, glob
          errors = []
          pj = json.load(open('.claude-plugin/plugin.json'))
          if 'name' not in pj:
            errors.append("plugin.json missing required 'name'")
          for legacy in ('commands', 'skills', 'subagents', 'hooks'):
            if isinstance(pj.get(legacy), list):
              errors.append(f"plugin.json must not declare an inline '{legacy}' array (use auto-discovery)")
          if not glob.glob('commands/*.md'): errors.append("no commands/*.md")
          if not glob.glob('agents/*.md'): errors.append("no agents/*.md")
          if not glob.glob('skills/*/SKILL.md'): errors.append("no skills/<name>/SKILL.md")
          if not os.path.exists('hooks/hooks.json'): errors.append("missing hooks/hooks.json")
          for f in glob.glob('skills/*/SKILL.md') + glob.glob('agents/*.md'):
            head = open(f).read(600)
            if not (head.startswith('---') and 'name:' in head and 'description:' in head):
              errors.append(f"{f}: missing name/description frontmatter")
          if errors:
            print("Structure errors:")
            for e in errors:
              print(" -", e)
            sys.exit(1)
          print("Plugin structure OK.")
          EOF

  validate-terraform:
    name: Terraform validate (snapshots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Validate snapshot modules
        run: |
          found=0
          # Vendor list comes from backends.txt (single source of truth).
          for vendor in $(cat backends.txt); do
            snap_dir="tests/snapshots/${vendor}"
            if [ -d "$snap_dir" ] && ls "$snap_dir"/*.tf.snap 2>/dev/null | head -1 > /dev/null; then
              found=$((found+1))
              echo "Validating $vendor..."
              # Copy snap to a temp dir for validation
              tmp=$(mktemp -d)
              cp "$snap_dir"/*.tf.snap "$tmp/main.tf"
              terraform -chdir="$tmp" init -backend=false -input=false 2>&1 | tail -5
              terraform -chdir="$tmp" validate
              rm -rf "$tmp"
            else
              echo "MISSING: no committed snapshot for $vendor"
            fi
          done
          # Fail loudly if the gate is inactive — a silently-skipped gate reads as green
          # while protecting nothing.
          if [ "$found" -eq 0 ]; then
            echo "::error::Terraform snapshot gate is INACTIVE — no golden snapshots committed."
            echo "Commit at least one tests/snapshots/<vendor>/main.tf.snap (see tests/snapshots/README.md)."
            exit 1
          fi
          echo "Validated $found committed snapshot module(s)."

  drift-check:
    name: Upstream drift check (scheduled / manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      # Reports (as ::warning:: + a job-summary table) where the plugin's pinned versions —
      # semconv spec, OTel Node/Python SDK packages, and Terraform providers — have fallen
      # behind upstream. Informational: never fails the build. See scripts/drift_check.py.
      - name: Check pinned versions against upstream
        run: python3 scripts/drift_check.py
