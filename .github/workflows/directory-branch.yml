# .github/workflows/directory-branch.yml
# Publishes the slim plugin folder (scripts/build-directory.sh) to the `directory` branch, which is
# what Anthropic's plugin directory follows. The directory scans each new commit on that branch, so
# every push to main that changes the plugin reaches it without a resubmission; a push that leaves
# the build unchanged commits nothing. Installing from this repo's own marketplace uses main and is
# unaffected. See docs/listing/plugin-directory.md.
name: Directory branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time, in push order, so the branch never moves backwards.
concurrency:
  group: directory-branch
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the slim plugin to the directory branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the build
        run: bash tests/directory-build.test.sh

      - name: Build and commit to the directory branch
        run: |
          OUT="$(mktemp -d)/plugin"
          bash scripts/build-directory.sh "$OUT"
          VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          W="$(mktemp -d)/directory"
          if git ls-remote --exit-code --heads origin directory >/dev/null; then
            git fetch -q origin directory
            git worktree add -q -B directory "$W" origin/directory
          else
            git worktree add -q --detach "$W"
            git -C "$W" checkout -q --orphan directory
            git -C "$W" rm -rqf .
          fi
          find "$W" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$OUT"/. "$W"/
          git -C "$W" add -A
          if git -C "$W" diff --cached --quiet; then
            echo "Build unchanged; nothing to publish."
            exit 0
          fi
          git -C "$W" commit -q -m "otel-as-code ${VERSION}: build of main ${GITHUB_SHA::7}"
          git -C "$W" push -q origin directory
          echo "Published otel-as-code ${VERSION} (main ${GITHUB_SHA::7}) to the directory branch." >> "$GITHUB_STEP_SUMMARY"
