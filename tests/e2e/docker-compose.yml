# tests/e2e/docker-compose.yml
# #1 integration: wires the golden agent Collector config (tests/snapshots/collector/
# otelcol-agent.yaml.snap) as a real app -> collector -> jaeger path, for both Node.js
# and Python golden bootstraps. Driven by run.sh; not started manually in CI.
services:
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # query UI/API (assertions read this from the host)
    # No healthcheck: jaegertracing/all-in-one is a scratch/minimal image with no
    # shell, wget, or curl, so a CMD-based healthcheck can never succeed and would
    # leave the container permanently "unhealthy" (breaking any service_healthy
    # dependency on it). Readiness is instead checked from the HOST in run.sh
    # (curl against http://localhost:16686/), and the collector's OTLP exporter has
    # retry_on_failure enabled, so it tolerates jaeger not being immediately ready.

  collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    # Golden config + an E2E-only overlay (deep-merged) that also writes received logs to a file
    # so assert-logs.sh can prove the Python --experimental logs path. See collector-logs-overlay.yaml.
    command:
      - "--config=/etc/otelcol/config.yaml"
      - "--config=/etc/otelcol/logs-overlay.yaml"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4317"   # golden config exports here
    volumes:
      - ../snapshots/collector/otelcol-agent.yaml.snap:/etc/otelcol/config.yaml:ro
      - ./collector-logs-overlay.yaml:/etc/otelcol/logs-overlay.yaml:ro
      - ./.work/collector-out:/out   # file exporter writes logs.json here (run.sh makes it world-writable)
    depends_on: [jaeger]

  node-app:
    image: node:20-bookworm-slim
    working_dir: /app
    environment:
      OTEL_SERVICE_NAME: "checkout-api"
      OTEL_SERVICE_VERSION: "1.4.2"
      OTEL_SERVICE_NAMESPACE: "storefront"
      DEPLOYMENT_ENV: "e2e"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"   # be explicit (match python); don't rely on http://-scheme insecure inference
      PORT: "3000"
    ports:
      - "3000:3000"   # load is driven from the host (see run.sh)
    volumes:
      - ./.work/nodejs:/app
    command: ["sh", "-c", "npm install --no-audit --no-fund --loglevel=error && node -r ./tracing.js index.js"]
    depends_on: [collector]

  python-app:
    image: python:3.12-slim-bookworm
    working_dir: /app
    environment:
      OTEL_SERVICE_NAME: "inventory-api"
      OTEL_SERVICE_VERSION: "0.3.1"
      OTEL_SERVICE_NAMESPACE: "storefront"
      DEPLOYMENT_ENV: "e2e"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"   # python grpc exporter defaults to TLS otherwise
    ports:
      - "8000:8000"   # load is driven from the host (see run.sh)
    volumes:
      - ./.work/python:/app
    command: ["sh", "-c", "pip install --no-cache-dir -q -r requirements.txt && uvicorn e2e_main:app --host 0.0.0.0 --port 8000"]
    depends_on: [collector]

  java-app:
    image: eclipse-temurin:21-jdk-jammy
    working_dir: /app
    environment:
      PORT: "8080"
      # deployment.environment.name in the golden otel-java.env is `${DEPLOYMENT_ENV:-development}`
      # (per-deployment, like node/python). Sourcing the file expands it against this — proving
      # the confirmed value is not baked static and can differ per target (#32).
      DEPLOYMENT_ENV: "e2e"
    ports:
      - "8080:8080"   # load is driven from the host (see run.sh)
    volumes:
      - ./.work/java:/app
    # Compile the pristine fixture, source the golden otel-java.env for service identity, then
    # repoint the OTLP endpoint at the in-network collector (the golden file's localhost:4317 is
    # the user-facing default — the same override node/python do via env), and run under the agent.
    # `http://` endpoint => the agent's gRPC exporter uses plaintext, so no extra insecure flag.
    command:
      - "sh"
      - "-c"
      - "javac App.java && set -a && . ./otel-java.env && export OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4317 && set +a && java -javaagent:./opentelemetry-javaagent.jar -cp . App"
    depends_on: [collector]

  nextjs-app:
    image: node:20-bookworm-slim
    working_dir: /app
    environment:
      OTEL_SERVICE_NAME: "web-frontend"
      OTEL_RESOURCE_ATTRIBUTES: "service.version=2.1.0,service.namespace=storefront,deployment.environment.name=e2e"
      # @vercel/otel exports over OTLP/HTTP only — use the collector's HTTP port (4318), NOT the
      # gRPC 4317 the other services use. Pairing @vercel/otel with 4317 fails silently (#29).
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
    ports:
      - "3001:3000"   # load is driven from the host (see run.sh)
    volumes:
      - ./.work/nextjs:/app
    # Greenfield App Router fixture + golden instrumentation.js (register hook) + @vercel/otel.
    # Next.js 15 auto-detects instrumentation.js, so `register()` runs at server start with no
    # extra wiring; its built-in tracing then emits server spans for the route handlers.
    command: ["sh", "-c", "npm install --no-audit --no-fund --loglevel=error && npm run build && npm start"]
    depends_on: [collector]

  dotnet-app:
    # SDK image (not runtime) because the container restores + builds the source inline, like the
    # other apps. Tag matches the golden csproj's <TargetFramework>net8.0</TargetFramework>.
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app
    environment:
      # The golden OpenTelemetry.cs reads service.name from OTEL_SERVICE_NAME (IConfiguration
      # includes env vars by default). Use a name DISTINCT from node-app's checkout-api — a
      # duplicate service.name would merge in Jaeger and muddy the per-service assertion.
      OTEL_SERVICE_NAME: "checkout-dotnet"
      # service.version (1.4.2) and service.namespace (checkout) are set in the golden
      # OpenTelemetry.cs itself; deployment.environment.name reads DEPLOYMENT_ENV at runtime.
      DEPLOYMENT_ENV: "e2e"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"   # .NET OTLP exporter defaults to grpc:4317; be explicit
      ASPNETCORE_URLS: "http://+:8080"      # where Kestrel listens inside the container
    ports:
      - "5001:8080"   # load is driven from the host (see run.sh)
    volumes:
      - ./.work/dotnet:/app
    # Greenfield Program.cs (with the one documented AddOtelObservability line) + golden
    # OpenTelemetry.cs + golden instrumented .csproj, seeded by run.sh. `dotnet run` restores,
    # builds, and serves; the AddAspNetCore/HttpClient instrumentation emits server spans that the
    # OTLP exporter ships to the in-network collector.
    command: ["sh", "-c", "dotnet restore && dotnet run --no-launch-profile"]
    depends_on: [collector]

  go-app:
    # SDK image (not a distroless runtime) because the container builds the source inline, like
    # the other apps. golang:1.25 matches the golden go.mod's `go 1.25.0` directive.
    image: golang:1.25-bookworm
    working_dir: /app
    environment:
      # The golden tracing.go reads service.name from OTEL_SERVICE_NAME (envOrDefault). Use a
      # name DISTINCT from every other service — a duplicate service.name would merge in Jaeger.
      OTEL_SERVICE_NAME: "search-api"
      DEPLOYMENT_ENV: "e2e"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4317"
      PORT: "8080"
    ports:
      - "8082:8080"   # load is driven from the host (see run.sh)
    volumes:
      - ./.work/go:/app
    # Greenfield main.go (net/http, health + search routes) + golden tracing.go (defines
    # InitOtel) + golden go.mod (adds the pinned OTel packages, replacing the greenfield one),
    # seeded by run.sh. `go mod download` then `go run .` builds and serves; otelhttp wraps the
    # mux (the one documented paste-in line, baked into the fixture's main.go like .NET's
    # Program.cs carries its one documented line) and ships spans over OTLP/gRPC to the collector.
    command: ["sh", "-c", "go mod download && go run ."]
    depends_on: [collector]
